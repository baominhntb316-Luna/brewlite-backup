name: BrewLite CI Pipeline (Sprint 1 - Task 4.4)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-monorepo:
    name: validate-monorepo
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: 3. Setup Environment File
        run: cp .env.example .env

      - name: 4. Install Backend Dependencies
        working-directory: apps/api
        run: npm ci || npm install

      - name: 5. Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: 6. Lint Backend Code
        working-directory: apps/api
        run: npx --yes oxlint --ignore-path ../../.gitignore || true

      - name: 7. Execute Backend Unit Tests (Products & Health)
        working-directory: apps/api
        run: npx jest src/products/products.service.spec.ts src/health/health.controller.spec.ts --passWithNoTests

      - name: 8. Build Backend Application (NestJS)
        working-directory: apps/api
        run: npm run build

      - name: 9. Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: 10. Lint Frontend Code
        working-directory: apps/web
        run: npm run lint || true

      - name: 11. Build Frontend Application (Next.js)
        working-directory: apps/web
        run: npm run build || true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
