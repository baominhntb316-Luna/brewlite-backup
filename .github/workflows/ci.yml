name: BrewLite CI Pipeline (Sprint 1 - Task 4.4)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-monorepo:
    name: Build, Lint and Test Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: 3. Install Backend Dependencies
        working-directory: apps/api
        run: npm ci || npm install

      - name: 4. Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: 5. Lint Backend Code
        working-directory: apps/api
        run: npm run lint

      - name: 6. Execute Backend Unit Tests (Products & Health)
        working-directory: apps/api
        run: npm test -- --coverage --passWithNoTests

      - name: 7. Build Backend Application (NestJS)
        working-directory: apps/api
        run: npm run build

      - name: 8. Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: 9. Lint Frontend Code
        working-directory: apps/web
        run: npm run lint

      - name: 10. Build Frontend Application (Next.js)
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
